# Builds, tests, deploys and verifies rayzr.app (Cloudflare Pages project
# rayzr-website). One definition for every trigger:
#   - pushes to main and the daily schedule: deploy (the schedule picks up a
#     dev build whose own deploy failed);
#   - pull requests: build + test, deployed to a preview URL and verified there;
#   - the engine repository (bcrowe306/rayzr) calls it (workflow_call):
#       release.yml after publishing a build to R2  -> deploy: true
#       docs.yml on its pull requests               -> engine_ref: the PR (its docs
#                                                      as the dev version), no deploy
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (here and in the engine
# repository, passed with `secrets: inherit`).
name: Site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to production"
        type: boolean
        default: true
  workflow_call:
    inputs:
      deploy:
        description: "Deploy to production after the tests"
        type: boolean
        default: false
      engine_ref:
        description: "Build the dev docs from this engine commit (a pull request) instead of main"
        type: string
        default: ""
      reason:
        description: "Why (shown in the run)"
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      SITE_BUILD_ID: ${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}
      # (Called from the engine: github.repository is the engine's, the event its own.)
      PRODUCTION: ${{ (github.repository == 'bcrowe306/rayzr_website' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy))) || (github.repository != 'bcrowe306/rayzr_website' && inputs.deploy) }}
    concurrency:
      group: rayzr-site-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
      cancel-in-progress: false
    steps:
      - name: The site
        uses: actions/checkout@v4
        with:
          repository: bcrowe306/rayzr_website
          ref: ${{ github.repository == 'bcrowe306/rayzr_website' && github.sha || 'main' }}

      - name: The engine at the pull request (its docs as the dev version)
        if: inputs.engine_ref != ''
        uses: actions/checkout@v4
        with:
          repository: bcrowe306/rayzr
          ref: ${{ inputs.engine_ref }}
          path: .engine
          sparse-checkout: |
            docs
            scripts/docs
            engine
            editor
            templates
            README.md
            RELEASING.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Sync (manifest, docs of every version, features)
        run: |
          [ -n "${{ inputs.reason }}" ] && echo "::notice::${{ inputs.reason }}"
          if [ -d .engine ]; then export ENGINE_DIR="$PWD/.engine"; fi
          npm run sync

      - name: Type check
        run: npm run check

      - name: Build (internal links validated)
        run: npx astro build

      - name: End-to-end tests
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Deploy (production)
        id: prod
        if: env.PRODUCTION == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name rayzr-website --branch main --commit-hash "$GITHUB_SHA" --commit-message "$SITE_BUILD_ID" --commit-dirty=true

      - name: Verify the deployment (rayzr.app)
        if: env.PRODUCTION == 'true'
        run: node scripts/verify-deploy.mjs --url https://rayzr.app --expect-build "$SITE_BUILD_ID" --timeout 420

      - name: Deploy (preview)
        id: preview
        if: env.PRODUCTION != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler pages deploy dist --project-name rayzr-website --branch "pr-${{ github.event.repository.name }}-${{ github.event.number }}" --commit-dirty=true 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://[a-z0-9.-]+\.rayzr-website\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Preview: $url"

      - name: Verify the preview
        if: steps.preview.outputs.url != ''
        run: node scripts/verify-deploy.mjs --url "${{ steps.preview.outputs.url }}" --expect-build "$SITE_BUILD_ID" --timeout 300 --skip-www
